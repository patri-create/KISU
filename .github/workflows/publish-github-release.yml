name: Publish GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"

          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "GitHub releases can only be created from a non-snapshot VERSION_NAME. Current value: $version"
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_NAME must match MAJOR.MINOR.PATCH for a release. Current value: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.TAG
            const version = process.env.VERSION

            const existing = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })

            const release = existing.data.find((item) => item.tag_name === tag)

            if (release && !release.draft) {
              core.notice(`Release ${tag} already exists`)
              return
            }

            if (release && release.draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                draft: false,
                prerelease: false,
              })

              core.notice(`Published existing draft release ${tag} for version ${version}`)
              return
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            })

            core.notice(`Published GitHub release ${tag} for version ${version}`)
