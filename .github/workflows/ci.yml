name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-feature:
    name: Check Feature Branch (Tests + Coverage)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Validate public API
        run: ./gradlew checkKotlinAbi

      - name: Build and test
        run: ./gradlew :lib:build

      - name: Generate coverage report
        run: ./gradlew :lib:jacocoTestReport

      - name: Verify report outputs
        run: |
          test -f lib/build/reports/jacoco/test/jacocoTestReport.xml || {
            echo "Expected JaCoCo XML report at lib/build/reports/jacoco/test/jacocoTestReport.xml"
            exit 1
          }

          test -f lib/build/reports/jacoco/test/html/index.html || {
            echo "Expected JaCoCo HTML report at lib/build/reports/jacoco/test/html/index.html"
            exit 1
          }

          test -d lib/build/test-results/test || {
            echo "Expected JUnit XML test results directory at lib/build/test-results/test"
            exit 1
          }

          test_result="$(find lib/build/test-results/test -name 'TEST-*.xml' -print -quit)"
          test -n "$test_result" || {
            echo "Expected JUnit XML test results under lib/build/test-results/test"
            exit 1
          }

      - name: Upload reports to Codecov
        uses: ./.github/actions/upload-codecov
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          use-token: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'true' || 'false' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: feature-coverage-report
          path: lib/build/reports/jacoco/test/html
          if-no-files-found: error
