name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  check-feature:
    name: Check Feature Branch (Tests + Coverage)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Validate public API
        run: ./gradlew checkKotlinAbi

      - name: Build and test
        run: ./gradlew :lib:build

      - name: Generate coverage report
        run: ./gradlew :lib:jacocoTestReport

      - name: Verify coverage report output
        run: |
          test -f lib/build/reports/jacoco/test/html/index.html || {
            echo "Expected JaCoCo HTML report at lib/build/reports/jacoco/test/html/index.html"
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: feature-coverage-report
          path: lib/build/reports/jacoco/test/html
          if-no-files-found: error
