name: Publish Maven Central

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version segment to increment for the release"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: maven-central-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-maven-central:
    runs-on: ubuntu-latest

    steps:
      - name: Enforce owner-only release execution
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$ACTOR" != "Sefford" ]]; then
            echo "This workflow can only be run by Sefford. Current actor: $ACTOR"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Verify publishing secrets are available
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          for key in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD RELEASE_PUSH_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Validate Sonatype credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          namespace="$(grep '^CENTRAL_NAMESPACE=' gradle.properties | cut -d= -f2)"
          bearer_token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"

          curl --fail-with-body --silent \
            --header "Authorization: Bearer $bearer_token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=client&profile_id=$namespace" >/dev/null

      - name: Validate signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys --keyid-format LONG

      - name: Validate repository push token
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          repo_response="$(
            curl --fail-with-body --silent \
              --header "Authorization: Bearer $RELEASE_PUSH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Sefford/KISU"
          )"

          can_push="$(printf '%s' "$repo_response" | jq -r '.permissions.push')"
          if [[ "$can_push" != "true" ]]; then
            echo "RELEASE_PUSH_TOKEN does not have push permission for Sefford/KISU"
            printf '%s\n' "$repo_response"
            exit 1
          fi

      - name: Compute next release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current_version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          base_version="${current_version%-SNAPSHOT}"

          if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Current VERSION_NAME must match MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-SNAPSHOT"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump type: $BUMP"
              exit 1
              ;;
          esac

          release_version="$major.$minor.$patch"
          next_snapshot="$major.$minor.$((patch + 1))-SNAPSHOT"

          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=$next_snapshot" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

      - name: Apply release version to workspace
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$RELEASE_VERSION/" gradle.properties
          grep '^VERSION_NAME=' gradle.properties

      - name: Dry-run the release publication locally
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :lib:publishToMavenLocal :lib:signMavenPublication

      - name: Verify generated publication files
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          group="$(grep '^LIB_GROUP=' gradle.properties | cut -d= -f2)"
          artifact_id="$(grep '^POM_ARTIFACT_ID=' gradle.properties | cut -d= -f2)"
          group_path="$(printf '%s' "$group" | tr '.' '/')"
          local_repo="$HOME/.m2/repository/$group_path/$artifact_id/$version"

          test -f lib/build/publications/maven/pom-default.xml || {
            echo "Expected generated POM at lib/build/publications/maven/pom-default.xml"
            exit 1
          }

          test -f "$local_repo/$artifact_id-$version.pom" || {
            echo "Expected Maven local POM at $local_repo/$artifact_id-$version.pom"
            exit 1
          }

          test -f "$local_repo/$artifact_id-$version.jar" || {
            echo "Expected Maven local jar at $local_repo/$artifact_id-$version.jar"
            exit 1
          }

          test -f "$local_repo/$artifact_id-$version-sources.jar" || {
            echo "Expected Maven local sources jar at $local_repo/$artifact_id-$version-sources.jar"
            exit 1
          }

          test -f "$local_repo/$artifact_id-$version-javadoc.jar" || {
            echo "Expected Maven local javadoc jar at $local_repo/$artifact_id-$version-javadoc.jar"
            exit 1
          }

      - name: Publish signed artifacts to Sonatype staging API
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :lib:publishMavenPublicationToSonatypeRepository

      - name: Upload staged deployment to Central Portal
        id: portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          namespace="$(grep '^CENTRAL_NAMESPACE=' gradle.properties | cut -d= -f2)"
          bearer_token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"

          upload_response="$(
            curl --fail-with-body --silent \
              --request POST \
              --header "Authorization: Bearer $bearer_token" \
              "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$namespace?publishing_type=automatic"
          )"

          deployment_id="$(printf '%s' "$upload_response" | jq -r '.portal_deployment_id')"

          if [[ -z "$deployment_id" || "$deployment_id" == "null" ]]; then
            echo "Unable to resolve portal deployment ID from response:"
            printf '%s\n' "$upload_response"
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Central publication to finish
        env:
          DEPLOYMENT_ID: ${{ steps.portal.outputs.deployment_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          bearer_token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"

          for attempt in {1..40}; do
            status_response="$(
              curl --fail-with-body --silent \
                --request POST \
                --header "Authorization: Bearer $bearer_token" \
                "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"
            )"

            deployment_state="$(printf '%s' "$status_response" | jq -r '.deploymentState')"
            echo "Deployment state: $deployment_state"

            if [[ "$deployment_state" == "PUBLISHED" ]]; then
              exit 0
            fi

            if [[ "$deployment_state" == "FAILED" ]]; then
              echo "Central deployment failed:"
              printf '%s\n' "$status_response"
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for Central deployment $DEPLOYMENT_ID"
          exit 1

      - name: Commit release version and tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/Sefford/KISU.git"
          git add gradle.properties
          git commit -m "Release library version $RELEASE_VERSION"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.release_version }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if gh release view "$TAG" --repo Sefford/KISU >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" \
            --repo Sefford/KISU \
            --title "$TAG" \
            --generate-notes

          echo "Published GitHub release $TAG for version $VERSION"

      - name: Advance main to next snapshot
        env:
          NEXT_SNAPSHOT: ${{ steps.version.outputs.next_snapshot }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEXT_SNAPSHOT/" gradle.properties
          grep '^VERSION_NAME=' gradle.properties
          git add gradle.properties
          git commit -m "Start next development version $NEXT_SNAPSHOT"
          git push origin HEAD:main
