coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
